  year: 2020
  type: measured
  ir_kinds: [room]
  capture_formats: [sdm_array, binaural, array_raw]
  content: About 600 multichannel SRIRs from 3 performance spaces (Konzerthaus ~600 seats, Brahmssaal ~100 seats, Sommertheater ~300 seats), stage and audience positions, open SDM array and dummy head; incl. orchestra loudspeaker setups.
  expected: {n_irs: 657, n_rooms: 3, note: "~600 multichannel RIRs; figure-8 files of set C not indexed"}
  license: {spdx: CC-BY-4.0, redistribute_audio: yes}
  access: open
  source: {kind: zenodo, records: ["4116247"]}
  adapter:
    name: wav_tree
    params:
      pattern: 'Set(?P<set>[ABC])_[^/]+/Data/(?:(?P<room>Brahmssaal|KonzertHaus|SommerTheater)/)?(?P<mic>DummyHead|OpenArray|Omni)/(?:(?P<cond>[^/]+)/)?(?P<rcv>[^/]+)\.wav$'
      room_default: KonzertHaus
      roles: {1: [omni], 2: [L, R], 6: [mic_0, mic_1, mic_2, mic_3, mic_4, mic_5]}
      channel_formats: {1: mono_omni, 2: binaural, 6: sdm_array}
  wave: 1
  homepage: https://zenodo.org/records/4116247
  doi: 10.5281/zenodo.4116247
  status: planned

- id: raves
  name: "RAVes: Room Acoustic Variances"
  year: 2026
  type: measured
  ir_kinds: [room]
  capture_formats: [sdm_array, binaural]
  content: SRIRs and BRIRs of a 5.0 loudspeaker layout (ITU-R BS.2159, r=2 m) in 7 rooms (RT 0.21-1.20 s plus a lecture hall and a foyer), at middle, wall and edge listening positions.
  expected: {n_rooms: 7}
  license: {spdx: CC-BY-4.0, redistribute_audio: yes}
  access: open
  source: {kind: zenodo, records: ["19809790"], include: ["SRIRs_*.zip", "BRIRs_*.zip", "Floor_plans.zip"]}
  adapter:
    name: sofa
    params:
      groups:
        # 72 head orientations x 5 loudspeakers per file: analyse the frontal orientation (m = 0)
        - {glob: "BRIRs_*/**/*.sofa", pattern: 'BRIRs_(?P<room>.+)_(?P<rcv>[EMW])\.sofa$', roles: [L, R],
           capture_format: binaural, m_select: [0], preferred: false}
        - {glob: "SRIRs_*/**/*.sofa", pattern: 'SRIRs_(?P<room>.+)_(?P<rcv>[EMW])\.sofa$',
           capture_format: sdm_array, reference_role: mic_0}
  keep_archive: false
  wave: 1
  homepage: https://zenodo.org/records/19809790
  doi: 10.5281/zenodo.19809790
  status: planned

- id: bras
  name: BRAS - Benchmark for Room Acoustical Simulation
  year: 2020
  type: measured
  ir_kinds: [room]
  capture_formats: [mono_omni, binaural]
  fs_hz: [44100]
  content: Measured RIRs and BRIRs (SOFA + wav) of 11 reference scenes (4 complex rooms CR1-CR4 and simple scenes RS1-RS7) plus RS8 (2026), each with geometry, boundary conditions and source/receiver descriptions.
  expected: {note: "12 scenes"}
  license: {spdx: CC-BY-SA-4.0, redistribute_audio: yes}
  access: open
  source:
    kind: depositonce
    records: ["38410727-febb-4769-8002-9c710ba393c4", "326fed8c-636a-47f2-977d-b4fd6a0ce771"]
    include: ["Documentation.pdf", "1_scene_descriptions-*.zip", "1_Scene_descriptions.zip", "3_surface_descriptions.zip", "3_Surface_descriptions.zip", "4_additional_data.zip"]
  adapter:
    name: wav_tree
    # complex rooms CR1-CR4 only; RS1-RS8 are single-reflection/diffraction scenes (not rooms)
    params:
      pattern: '1_scene_descriptions-(?P<room>CR\d)/.*/(?P<cond>RIRs|BRIRs)/wav/(?P<label>[^/]+)\.wav$'
      channels: [1, 2]
      roles: {1: [omni], 2: [L, R]}
      channel_formats: {1: mono_omni, 2: binaural}
      preferred_regex: '/RIRs/wav/'
  wave: 1
  homepage: https://depositonce.tu-berlin.de/items/38410727-febb-4769-8002-9c710ba393c4
  paper: {title: "A benchmark for room acoustical simulation. Concept and database", url: "https://www.sciencedirect.com/science/article/abs/pii/S0003682X20309725"}
  status: planned

- id: mird
  name: Multichannel Impulse Response Database (Bar-Ilan)
  year: 2014
  type: measured
  ir_kinds: [room]
  capture_formats: [array_raw]
  content: 234 8-channel RIRs recorded in the same room with 3 levels of reverberation (0.16/0.36/0.61 s) and 3 microphone array spacings (.mat files).
  expected: {n_irs: 234, n_rooms: 1, note: "1 room x 3 reverberation settings"}
  license: {spdx: ODC-By-1.0, redistribute_audio: unknown}
  access: manual
  source:
    kind: manual
    instructions: "The Bar-Ilan web firewall rejects scripted requests for these archives (any URL containing parentheses returns an HTML \"Request Rejected\" page with HTTP 200; checked 2026-09-30). Download the nine Impulse_response_Acoustic_Lab_Bar-Ilan_University_(Reverberation_*)_*.zip files from https://www.eng.biu.ac.il/~gannot/RIR_DATABASE/ in a browser into $RIRDB_ROOT/raw/_inbox/mird/, then run `sbatch jobs/download.sh fetch/adopt_manual.sh mird`."
  wave: 1
  homepage: https://www.eng.biu.ac.il/gannot/downloads/
  paper: {title: "Multichannel audio database in various acoustic environments", url: "https://ieeexplore.ieee.org/document/6954309"}
  status: manual

- id: iosr_listening_room_brirs
  name: IoSR listening room multichannel BRIRs
  year: 2016
  type: measured
  ir_kinds: [room]
  capture_formats: [binaural]
  content: BRIRs of an ITU-R BS.1116 listening room for 24 loudspeakers in the 22.2 layout, at head angles 0-360 deg in 2.5 deg steps.
  license: {spdx: CC-BY-4.0, redistribute_audio: yes}
  access: open
  source: {kind: github, records: ["IoSR-Surrey/IoSR_ListeningRoom_BRIRs@master"]}
  adapter:
    name: mat_array
    # brir[65536, 2 ears, 24 loudspeakers] per head angle (0-357.5 deg in 2.5 deg): frontal angle only
    params: {glob: "**/angle_0.0.mat", var: brir, time_axis: 0, channel_axis: 1, record_axis: 2,
             roles: [L, R], capture_format: binaural, fs: 48000, room_default: iosr-listening-room,
             record_prefix: spk}
  wave: 1
  homepage: https://github.com/IoSR-Surrey/IoSR_ListeningRoom_BRIRs
  status: planned

