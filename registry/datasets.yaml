- id: openslr28
  name: RWCP + REVERB (via OpenSLR 28)
  year: 2017
  type: measured
  ir_kinds: [room]
  capture_formats: [array_raw, mono_omni]
  fs_hz: [16000]
  content: "Real RIRs bundled by OpenSLR 28 at 16 kHz: RWCP Sound Scene Database (2000; 143 multi-channel RIRs in 14 rooms) and REVERB Challenge (2013; 24 8-channel RIRs in small/medium/large rooms). Its AIR copy is de-duplicated against aachen_air; noises and simulated RIRs are not indexed."
  expected: {n_irs: 200, note: "RWCP + REVERB records; OpenSLR lists 325 files incl. 107 AIR copies (skipped)"}
  license: {spdx: Apache-2.0, url: "https://www.openslr.org/28/", redistribute_audio: unknown, note: "Bundle is Apache-2.0; RWCP and REVERB components keep their own terms."}
  access: open
  source: {kind: http, urls: ["https://www.openslr.org/resources/28/rirs_noises.zip"]}
  adapter: {name: openslr28}
  wave: 1
  homepage: https://www.openslr.org/28/
  paper: {title: "Sound scene data collection in real acoustical environments (RWCP)", url: "https://library.naist.jp/dspace/bitstream/handle/10061/7746/JourAcouSocJaE_20_3_225.pdf?sequence=1"}
  notes: "REVERB paper: https://ieeexplore.ieee.org/document/6701894 ; RWCP home: http://research.nii.ac.jp/src/en/RWCP-SSD.html"
  status: planned

- id: but_reverb
