# Registry of impulse-response datasets: the single source of truth.
# Validated by src/rirdb/registry.py; `rirdb registry compile` regenerates the
# README tables and registry/compiled/sources.tsv (read by fetch/*.sh).
#
# Conventions
#   wave   0 smoke | 1 many spaces (sparse) | 2 multi-condition | 3 dense grids | 4 simulated (later)
#   status planned (in a wave, not fetched yet) | active (fetched + indexed) | manual | broken | deferred
#   license.redistribute_audio gates what the future platform may serve:
#          yes | unaltered_only | no | unknown (treated as no)
#   fs_hz / expected: [] / null until confirmed by `rirdb probe` (P3).
# Source facts (record ids, file names, sizes, licences) were resolved from the
# provider APIs on 2026-09-30; exact files + checksums live in registry/locks/.

datasets:

# ============================================================== W0: smoke test
- id: mit_survey
  name: MIT IR Survey
  year: 2016
  type: measured
  ir_kinds: [room, outdoor, vehicle]
  capture_formats: [mono_omni]
  fs_hz: [32000]
  content: 271 mono RIRs, each recorded in a distinct everyday place (surveyed from daily-life locations of volunteers); the public archive holds 270 (32 kHz, 24-bit).
  expected: {n_irs: 270, n_rooms: 270, note: "paper reports 271; Audio.zip contains 270"}
  license: {spdx: LicenseRef-unspecified, redistribute_audio: unknown}
  access: open
  source: {kind: http, urls: ["https://mcdermottlab.mit.edu/Reverb/IRMAudio/Audio.zip"]}
  adapter:
    name: wav_tree
    params: {pattern: 'Audio/h\d+_(?P<label>.+?)(_\w*tx\w*)?\.wav$', room_from: file}
  wave: 0
  homepage: https://mcdermottlab.mit.edu/Reverb/IR_Survey.html
  paper: {title: "Statistics of natural reverberation enable perceptual separation of sound and space", url: "https://www.pnas.org/content/113/48/E7856"}
  doi: 10.1073/pnas.1612524113
  status: planned

- id: rochester
  name: University of Rochester RIR dataset
  year: 2024
  type: measured
  ir_kinds: [room]
  capture_formats: [mono_omni]
  fs_hz: [48000]
  content: Mono RIRs (48 kHz, 32-bit) from 14 rooms of the University of Rochester with a wide range of RT60, clarity and EDT; room layouts and acoustic plots per room.
  expected: {n_irs: 90, n_rooms: 14}
  license: {spdx: CC-BY-4.0, redistribute_audio: yes}
  access: open
  source: {kind: figshare, records: ["26801089"]}
  adapter:
    name: wav_tree
    params: {pattern: 'Room0*(?P<room>\d+)/.*_Speak(?P<src>\d+)_Mic(?P<rcv>\d+)\.wav$'}
  wave: 0
  homepage: https://rochester.figshare.com/articles/dataset/University_of_Rochester_room_impulse_response_dataset/26801089
  doi: 10.60593/ur.d.26801089
  status: planned
  notes: "Room 13: the three Speak2 files are byte-identical copies of the Speak1 files (publishing error, found by content hash on 2026-09-30); the corpus_dedup view marks them."

- id: voxengo
  name: Voxengo free reverb impulse responses
  type: production
  ir_kinds: [room, outdoor, creative]
  capture_formats: [stereo]
  fs_hz: [44100]
  content: Free stereo reverb IRs of real spaces and processed spaces distributed with Voxengo's convolution tools.
  expected: {n_irs: 38}
  adapter: {name: wav_tree, params: {glob: "*.wav", room_from: file}}
  license:
    spdx: LicenseRef-Voxengo-IR
    url: https://www.voxengo.com/impulses/
    redistribute_audio: unaltered_only
    note: Royalty-free use incl. commercial; redistribution only complete, unaltered, free of charge, with the copyright notice; never sold.
  access: open
  source: {kind: http, urls: ["https://www.voxengo.com/files/impulses/IMreverbs.zip"]}
  wave: 0
  homepage: https://www.voxengo.com/impulses/
  status: planned

- id: echothief
  name: EchoThief impulse response library
  type: production
  ir_kinds: [room, outdoor]
  capture_formats: [stereo]
  fs_hz: [44100]
  content: More than a hundred real-world spaces sampled around North America (caves, tunnels, stairwells, glaciers, bridges, ...), from SDSU Music Recording Technology.
  expected: {n_irs: 115, n_rooms: 115}
  adapter:
    name: wav_tree
    params:
      pattern: 'EchoThiefImpulseResponseLibrary/(?P<cat>[^/]+)/(?P<label>[^/]+)\.wav$'
      room_from: file
      category_from: parent
      ir_kind_from_regex: {'/Nature/': outdoor}
  license:
    spdx: LicenseRef-EchoThief
    url: https://www.echothief.com/downloads/
    redistribute_audio: "no"
    training_use: prohibited
    note: "EchoThief License.pdf (in the archive): use to create derivative artistic work (e.g. convolution reverb); any other use by agreement with the author; not authorized for training AI."
  access: open
  source: {kind: http, urls: ["https://www.echothief.com/wp-content/uploads/2024/07/EchoThiefImpulseResponseLibrary.zip"]}
  wave: 0
  homepage: https://www.echothief.com/
  status: planned

# ======================================================= W1: many spaces (sparse)
- id: openair
  name: OpenAIR
  year: 2010
  type: measured
  ir_kinds: [room, outdoor, scale_model]
  capture_formats: [mono_omni, stereo, foa_fuma, binaural]
  content: Ambisonic B-format (and mono/stereo) RIRs recorded in over 46 (still increasing) environments, with per-space data tables. Includes a few non-room entries (scale model, slinky, simulated auralizations) tagged by ir_kind.
  expected: {n_irs: 690, n_rooms: 58, note: "IR folders only; sweeps, auralizations and examples skipped"}
  license: {spdx: CC-BY-4.0, url: "https://www.openairlib.net/", redistribute_audio: unknown, note: "Per-IR terms vary; confirm from the per-space tables before serving audio."}
  access: open
  source:
    kind: wget_mirror
    urls: ["https://webfiles.york.ac.uk/OPENAIR/IRs/"]
    accept: ["*.wav", "*.WAV", "*.csv", "*.txt", "*.xlsx", "*.pdf"]
  adapter: {name: openair}
  keep_archive: false
  wave: 1
  homepage: https://www.openairlib.net/
  paper: {title: "OpenAIR: An interactive auralization web resource and database", url: "https://www.aes.org/e-lib/browse.cfm?elib=15648"}
  status: planned

